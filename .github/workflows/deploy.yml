name: Deploy GuestBook

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build
      run: dotnet publish -c Release -r win-x64 --self-contained true -o ./publish

    - name: Upload build
      uses: actions/upload-artifact@v4
      with:
        name: guestbook-publish
        path: ./publish

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
    - name: Download build
      uses: actions/download-artifact@v4
      with:
        name: guestbook-publish
        path: ./publish

    - name: Deploy to local server
      shell: powershell
      env:
        STORAGE_CONNECTION: ${{ secrets.GUESTBOOK_STORAGE_CONNECTION }}
      run: |
        $site = 'C:\GuestBookSite'
        Get-Process GuestBook.Web -ErrorAction SilentlyContinue | Stop-Process -Force
        Start-Sleep -Seconds 2
        if (Test-Path $site) { Remove-Item "$site\*" -Recurse -Force }
        else { New-Item -ItemType Directory $site | Out-Null }
        Copy-Item .\publish\* $site -Recurse -Force
        $env:RUNNER_TRACKING_ID = ''
        $env:AzureStorage__ConnectionString = $env:STORAGE_CONNECTION
        $env:ASPNETCORE_URLS = 'http://localhost:8080'
        Start-Process "$site\GuestBook.Web.exe" -WorkingDirectory $site -WindowStyle Hidden

    - name: Check site
      shell: powershell
      run: |
        Start-Sleep -Seconds 5
        $r = Invoke-WebRequest http://localhost:8080/AllEntries -UseBasicParsing
        "Site is up: HTTP $($r.StatusCode)"
